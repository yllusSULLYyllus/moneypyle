services:
  db:
    image: postgres:latest
    container_name: fctc-moneypyle-data
    environment:
      POSTGRES_USER: sully
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "6543:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sully -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
  moneypyle:
    build: .
    image: moneypyle-v1
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: sully
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mydb
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
    command: >
      sh -c "
      python ./manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
volumes:
  pgdata: