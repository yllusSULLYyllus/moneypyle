{% extends 'base.html' %}

{% block content %}
<div>
    {% if error %}
    <p style="color: red;"> {{ error }} </p>
    {% endif %}
    <form action="" method="post"> {% csrf_token %}
        <div>
            <label for="">Username:</label><br>
            <input type="text" name="username">
        </div>
        <div>
            <label for="">Password:</label><br>
            <input type="password" name="password">
        </div>
        <div>
            <button type="submit">
                Sign in
            </button>
    </form>

</div>
</div>

{% endblock %}
